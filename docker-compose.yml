services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Keeps the ~2GB embedding model after its first download.
      - model_cache:/root/.cache/huggingface

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  model_cache:
  caddy_data:
