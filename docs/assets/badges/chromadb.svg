<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 32" width="156" height="32" fill="none">
  <defs>
    <!-- Vibrant Radiant Orange Gradient -->
    <linearGradient id="cr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="cr-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <style>
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #FFFFFF;
    }
    .badge-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #FFFFFF;
    }
  </style>

  <rect x="0.5" y="0.5" width="155" height="31" rx="6" fill="#161B22" stroke="rgba(249, 115, 22, 0.45)" stroke-width="1"/>

  <!-- High-Definition ChromaDB Isometric Vector Layers (18x18px) -->
  <g transform="translate(8, 7)">
    <!-- Top Layer -->
    <path d="M9 1.5 L16.5 5 L9 8.5 L1.5 5 Z" fill="#FB923C"/>
    <!-- Middle Layer -->
    <path d="M1.5 7 L9 10.5 L16.5 7 L16.5 9 L9 12.5 L1.5 9 Z" fill="#F97316"/>
    <!-- Bottom Layer -->
    <path d="M1.5 11 L9 14.5 L16.5 11 L16.5 13 L9 16.5 L1.5 13 Z" fill="#EA580C"/>
  </g>

  <text x="31" y="20" class="badge-label">ChromaDB</text>

  <!-- Value Pill with Metallic Shine -->
  <rect x="91" y="3.5" width="61" height="25" rx="4.5" fill="url(#cr-grad)" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <rect x="91" y="3.5" width="61" height="12.5" rx="4.5" fill="url(#cr-gloss)"/>
  <text x="121.5" y="20" text-anchor="middle" class="badge-value">Vector DB</text>
</svg>
