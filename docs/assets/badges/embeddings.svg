<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" width="160" height="32" fill="none">
  <defs>
    <!-- Vibrant Violet/Purple Metallic Gradient -->
    <linearGradient id="em-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="em-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <style>
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #FFFFFF;
    }
    .badge-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #FFFFFF;
    }
  </style>

  <rect x="0.5" y="0.5" width="159" height="31" rx="6" fill="#161B22" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1"/>

  <!-- High-Definition AI Neural Vector Nodes (18x18px) -->
  <g transform="translate(8, 7)">
    <!-- Connection Lines -->
    <line x1="4" y1="4.5" x2="14" y2="9" stroke="#A855F7" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="4" y1="13.5" x2="14" y2="9" stroke="#A855F7" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="4" y1="4.5" x2="4" y2="13.5" stroke="#7E22CE" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="4" cy="4.5" r="3" fill="#C084FC" stroke="#FFFFFF" stroke-width="0.8"/>
    <circle cx="4" cy="13.5" r="3" fill="#C084FC" stroke="#FFFFFF" stroke-width="0.8"/>
    <circle cx="14" cy="9" r="3.5" fill="#E9D5FF" stroke="#A855F7" stroke-width="1.2"/>
  </g>

  <text x="30" y="20" class="badge-label">Embeddings</text>

  <!-- Value Pill with Metallic Shine -->
  <rect x="96" y="3.5" width="60" height="25" rx="4.5" fill="url(#em-grad)" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <rect x="96" y="3.5" width="60" height="12.5" rx="4.5" fill="url(#em-gloss)"/>
  <text x="126" y="20" text-anchor="middle" class="badge-value">BGE-M3</text>
</svg>
