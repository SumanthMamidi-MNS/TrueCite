<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 32" width="142" height="32" fill="none">
  <defs>
    <!-- Vibrant Emerald-Teal Metallic Gradient -->
    <linearGradient id="fa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="fa-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <style>
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #FFFFFF;
    }
    .badge-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #FFFFFF;
    }
  </style>

  <rect x="0.5" y="0.5" width="141" height="31" rx="6" fill="#161B22" stroke="rgba(45, 212, 191, 0.45)" stroke-width="1"/>

  <!-- High-Definition FastAPI Lightning Bolt Icon (18x18px) -->
  <g transform="translate(8, 7)">
    <circle cx="9" cy="9" r="8.5" fill="#009688"/>
    <path d="M10 3 L5 10.5 H9.5 L8.5 15 L14 8.5 H9.5 L10.5 3 Z" fill="#FFFFFF"/>
  </g>

  <text x="32" y="20" class="badge-label">FastAPI</text>

  <!-- Value Pill with Metallic Shine -->
  <rect x="84" y="3.5" width="54" height="25" rx="4.5" fill="url(#fa-grad)" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <rect x="84" y="3.5" width="54" height="12.5" rx="4.5" fill="url(#fa-gloss)"/>
  <text x="111" y="20" text-anchor="middle" class="badge-value">0.115+</text>
</svg>
